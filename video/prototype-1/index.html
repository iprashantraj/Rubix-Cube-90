<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Kaarigar — PS 26090</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* ---------------------------------------------------------------
         Design system — code-editorial remixed onto Kaarigar's palette.
         Lives here, at the host, so all eight frames share one copy.
         Frame files carry only their own layout.
         --------------------------------------------------------------- */
      :root {
        --ink: #1c1917;
        --cream: #f8f3f1;
        --tile: #f7e7e1;
        --tile-strong: #7a2e1a;
        --coral: #9c3d24;
        --ok: #1f9d55;
        --muted: #6b625d;
        --hair: rgba(28, 25, 23, 0.12);
        --hair-strong: rgba(28, 25, 23, 0.2);
        --serif: "EB Garamond", Georgia, serif;
        --sans: Inter, system-ui, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, monospace;
        --deva: "Noto Sans Devanagari", "Noto Sans", system-ui, sans-serif;
        --pad: 80px;
        --card-shadow: 0 1px 3px rgba(28, 25, 23, 0.08), 0 4px 16px rgba(28, 25, 23, 0.04);
      }
      body { margin: 0; background: var(--cream); }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--cream);
      }
      [data-composition-id="root"] > div[data-composition-src] { position: absolute; inset: 0; }

      /* --- type ramp --- */
      .t-kicker {
        font: 500 28px/1 var(--mono);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--coral);
      }
      .t-mono { font: 500 26px/1.4 var(--mono); letter-spacing: 0.02em; color: var(--muted); }
      .t-mono-up {
        font: 500 24px/1.4 var(--mono);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .t-display-cover { font: 400 190px/0.98 var(--serif); letter-spacing: -0.028em; color: var(--ink); }
      .t-display { font: 400 140px/1.02 var(--serif); letter-spacing: -0.022em; color: var(--ink); }
      .t-headline { font: 400 88px/1.06 var(--serif); letter-spacing: -0.018em; color: var(--ink); }
      .t-quote { font: 500 74px/1.2 var(--deva); letter-spacing: -0.01em; color: var(--ink); }
      .t-number { font: 400 180px/0.95 var(--serif); letter-spacing: -0.025em; color: var(--ink); }
      .t-card-title { font: 500 44px/1.25 var(--sans); letter-spacing: -0.005em; color: var(--ink); }
      .t-lead { font: 400 40px/1.5 var(--sans); color: var(--muted); }
      .t-body { font: 400 29px/1.5 var(--sans); color: var(--muted); }
      .deva { font-family: var(--deva); }
      .coral { color: var(--coral); }
      .ok { color: var(--ok); }

      /* --- components --- */
      .rule { height: 1px; background: var(--hair); transform-origin: left center; }
      .card {
        background: var(--cream);
        border: 1px solid var(--hair);
        border-radius: 12px;
        box-shadow: var(--card-shadow);
        padding: 40px;
        box-sizing: border-box;
      }
      .chip {
        display: inline-block;
        font: 500 24px/1 var(--mono);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--tile-strong);
        background: var(--tile);
        border-radius: 9999px;
        padding: 16px 26px;
      }
      /* The phone. Same shell in frames 3–8; only the screen changes. */
      .phone {
        position: absolute;
        width: 470px;
        height: 1018px;
        border-radius: 44px;
        border: 1px solid var(--hair-strong);
        background: #fff;
        box-shadow: 0 2px 6px rgba(28, 25, 23, 0.08), 0 18px 48px rgba(28, 25, 23, 0.14);
        overflow: hidden;
      }
      .phone img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top center;
        display: block;
      }
      .mask { display: block; overflow: hidden; }
      .mask > * { display: block; padding: 0.24em 0; }
      .col { position: absolute; left: 80px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="root" data-start="0" data-width="1920" data-height="1080" data-duration="90">
      <div id="el-title"    data-composition-id="title"    data-composition-src="compositions/frames/01-title.html"    data-start="0" data-duration="6"  data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-problem"  data-composition-id="problem"  data-composition-src="compositions/frames/02-problem.html"  data-start="6" data-duration="16" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-solution" data-composition-id="solution" data-composition-src="compositions/frames/03-solution.html" data-start="22" data-duration="8"  data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-image"    data-composition-id="image"    data-composition-src="compositions/frames/04-image.html"    data-start="30" data-duration="14" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-catalog"  data-composition-id="catalog"  data-composition-src="compositions/frames/05-catalog.html"  data-start="44" data-duration="13" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-price"    data-composition-id="price"    data-composition-src="compositions/frames/06-price.html"    data-start="57" data-duration="11" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-usp"      data-composition-id="usp"      data-composition-src="compositions/frames/07-usp.html"      data-start="68" data-duration="15" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-close"    data-composition-id="close"    data-composition-src="compositions/frames/08-close.html"    data-start="83" data-duration="7"  data-track-index="1" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      window.__timelines["root"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
