<!doctype html>
<html>
  <head><meta charset="UTF-8" /><title>Frame 8 — Live</title></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; background: var(--cream); }
        #root .plate {
          position: absolute; left: 200px; top: 90px; width: 420px; height: 910px;
          border-radius: 40px; border: 1px solid var(--hair-strong); background: #fff; overflow: hidden;
          box-shadow: 0 2px 6px rgba(28,25,23,0.08), 0 18px 48px rgba(28,25,23,0.14);
        }
        #root .plate img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top center; }
        #root .live { position: absolute; left: 760px; top: 380px; width: 980px; }
        #root .end { position: absolute; left: 80px; top: 300px; width: 1760px; }
        #root .end .rule { width: 1760px; height: 1px; background: var(--hair); margin: 44px 0 36px; transform-origin: left center; }
        #root .end .lines div + div { margin-top: 16px; }
      </style>

      <div id="root" data-composition-id="close" data-width="1920" data-height="1080">
        <div class="plate" id="cl-plate"><img src="assets/shots/10-publish-live.png" alt="" /></div>

        <div class="live" id="cl-live">
          <div class="t-headline">Live on a government<br />marketplace. <span class="ok">Today.</span></div>
          <div class="t-mono-up" style="margin-top: 34px">Year-round · no middleman · no laptop · no English</div>
        </div>

        <div class="end" id="cl-end">
          <div class="t-display-cover coral" id="cl-name">Kaarigar</div>
          <div class="rule" id="cl-rule"></div>
          <div class="lines" id="cl-lines">
            <div class="t-mono-up">Problem statement 26090 · AI-driven market linkage and smart cataloging for marginalized artisans</div>
            <div class="t-mono-up">Ministry of Social Justice and Empowerment · Smart India Hackathon</div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const scope = '[data-composition-id="close"] ';
          const q = (s) => document.querySelector(scope + s);
          const tl = gsap.timeline({ paused: true });

          gsap.set(q("#cl-end"), { autoAlpha: 0 });

          tl.fromTo(q("#cl-plate"), { autoAlpha: 0, y: 34 }, { autoAlpha: 1, y: 0, duration: 0.9, ease: "power3.out" }, 0)
            .fromTo(q("#cl-live"), { autoAlpha: 0, y: 22 }, { autoAlpha: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.5)

            .to(q("#cl-plate"), { autoAlpha: 0, duration: 0.5, ease: "power2.inOut" }, 2.5)
            .to(q("#cl-live"), { autoAlpha: 0, duration: 0.5, ease: "power2.inOut" }, 2.5)

            .to(q("#cl-end"), { autoAlpha: 1, duration: 0.01 }, 2.85)
            .fromTo(q("#cl-name"), { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.9, ease: "power3.out" }, 2.9)
            .fromTo(q("#cl-rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, 3.4)
            .fromTo(q("#cl-lines"), { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.6 }, 3.7);

          window.__timelines["close"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
