<text x="170" y="475" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#7b8794" font-weight="400" text-anchor="start" letter-spacing="0">own language, no typing</text>
<rect x="880" y="422" width="460" height="76" rx="10" fill="#f4f0ff" stroke="#5b21b6" stroke-width="1.8"/>
<text x="900" y="453" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="15" fill="#1f2933" font-weight="600" text-anchor="start" letter-spacing="0">How many completed a listing</text>
<text x="900" y="475" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#7b8794" font-weight="400" text-anchor="start" letter-spacing="0">products digitised, the real output</text>
