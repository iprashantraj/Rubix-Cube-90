<rect x="150" y="300" width="320" height="76" rx="10" fill="#fff1e7" stroke="#c2410c" stroke-width="1.8"/>
<text x="170" y="331" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="15" fill="#1f2933" font-weight="600" text-anchor="start" letter-spacing="0">2.  Photographs the product</text>
<text x="170" y="353" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#7b8794" font-weight="400" text-anchor="start" letter-spacing="0">phone coaches the shot</text>
<rect x="880" y="300" width="460" height="76" rx="10" fill="#f4f0ff" stroke="#5b21b6" stroke-width="1.8"/>
<text x="900" y="331" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="15" fill="#1f2933" font-weight="600" text-anchor="start" letter-spacing="0">How many got past the camera</text>
<text x="900" y="353" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#7b8794" font-weight="400" text-anchor="start" letter-spacing="0">the first place people quietly stop</text>
