<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1080" viewBox="0 0 1560 1080">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b9c2cc"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b9c2cc"/></marker></defs>
<rect width="1560" height="1080" fill="#ffffff"/>
<text x="48" y="52" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="24" fill="#1f2933" font-weight="600" text-anchor="start" letter-spacing="0">The government sees the same journey — counted</text>
<text x="48" y="78" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="14" fill="#7b8794" font-weight="400" text-anchor="start" letter-spacing="0">Every box on the right is a count of the box on its left. One question, asked six times: where did they stop?</text>
<rect x="150" y="106" width="320" height="46" rx="8" fill="#fff1e7" stroke="#c2410c" stroke-width="2"/>
<text x="310" y="135" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="14" fill="#c2410c" font-weight="700" text-anchor="middle" letter-spacing="1.2">SELLER / ARTISAN</text>
<rect x="880" y="106" width="460" height="46" rx="8" fill="#f4f0ff" stroke="#5b21b6" stroke-width="2"/>
<text x="1110" y="135" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="14" fill="#5b21b6" font-weight="700" text-anchor="middle" letter-spacing="1.2">GOVERNMENT</text>
<rect x="150" y="178" width="320" height="76" rx="10" fill="#fff1e7" stroke="#c2410c" stroke-width="1.8"/>
<text x="170" y="209" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="15" fill="#1f2933" font-weight="600" text-anchor="start" letter-spacing="0">1.  Registers</text>
<text x="170" y="231" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#7b8794" font-weight="400" text-anchor="start" letter-spacing="0">signs up, names their craft</text>
<rect x="880" y="178" width="460" height="76" rx="10" fill="#f4f0ff" stroke="#5b21b6" stroke-width="1.8"/>
<text x="900" y="209" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="15" fill="#1f2933" font-weight="600" text-anchor="start" letter-spacing="0">How many onboarded</text>
<text x="900" y="231" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#7b8794" font-weight="400" text-anchor="start" letter-spacing="0">of everyone the agency invited</text>
