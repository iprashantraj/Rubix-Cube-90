<rect x="150" y="666" width="320" height="76" rx="10" fill="#fff1e7" stroke="#c2410c" stroke-width="1.8"/>
<text x="170" y="697" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="15" fill="#1f2933" font-weight="600" text-anchor="start" letter-spacing="0">5.  Publishes</text>
<text x="170" y="719" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#7b8794" font-weight="400" text-anchor="start" letter-spacing="0">GeM · ONDC · marketplaces</text>
<rect x="880" y="666" width="460" height="76" rx="10" fill="#f4f0ff" stroke="#5b21b6" stroke-width="1.8"/>
<text x="900" y="697" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="15" fill="#1f2933" font-weight="600" text-anchor="start" letter-spacing="0">How many reached a channel</text>
