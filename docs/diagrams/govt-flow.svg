<text x="672" y="404" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" fill="#b91c1c" font-weight="600" text-anchor="middle" letter-spacing="0">who fell out here</text>
<rect x="150" y="422" width="320" height="76" rx="10" fill="#fff1e7" stroke="#c2410c" stroke-width="1.8"/>
