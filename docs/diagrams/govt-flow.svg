<text x="900" y="819" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="15" fill="#1f2933" font-weight="600" text-anchor="start" letter-spacing="0">How many were actually paid</text>
<text x="900" y="841" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#7b8794" font-weight="400" text-anchor="start" letter-spacing="0">the only number that proves it worked</text>
