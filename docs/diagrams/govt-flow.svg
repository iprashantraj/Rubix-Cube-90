<text x="1110" y="960" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#7b8794" font-weight="400" text-anchor="middle" letter-spacing="0">the step, the district, the craft — and a report to export</text>
<rect x="150" y="908" width="460" height="78" rx="10" fill="#effcfa" stroke="#0f766e" stroke-width="2"/>
<text x="380" y="938" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="14" fill="#0f766e" font-weight="700" text-anchor="middle" letter-spacing="1">ONE SHARED DATABASE</text>
<text x="380" y="960" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#7b8794" font-weight="400" text-anchor="middle" letter-spacing="0">no new tracking — these are queries over rows the app already writes</text>
